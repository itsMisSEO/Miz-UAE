<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }}</title>
<meta name="description" content="{{ .Description }}">
<link rel="canonical" href="{{ .Permalink }}">
{{- range .AllTranslations }}
<link rel="alternate" hreflang="{{ .Language.Locale }}" href="{{ .Permalink }}">
{{- end }}
{{- range .AllTranslations }}{{ if eq .Language.Lang "en" }}
<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">{{ end }}{{ end }}
<link rel="icon" href="{{ partial "rel.html" site.Params.favicon }}" type="image/png">
<meta name="theme-color" content="#0b1020">
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
<link rel="preload" as="image" href="{{ partial "rel.html" site.Params.heroImage }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Description }}">
<meta property="og:site_name" content="{{ site.Params.siteName }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ strings.TrimPrefix "/" site.Params.ogImage | absURL }}">
<meta property="og:locale" content="{{ replace (site.Language.Locale) "-" "_" }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ .Description }}">
<meta name="twitter:image" content="{{ strings.TrimPrefix "/" site.Params.ogImage | absURL }}">
{{ with site.Params.trustpilotVerification }}<meta name="trustpilot-one-time-domain-verification-id" content="{{ . }}">{{ end }}
{{ partial "schema.html" . }}
